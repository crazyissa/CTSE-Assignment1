name: Delivery Service CI/CD

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
    paths:
      - 'backend/delivery_service/**'
      - '.github/workflows/delivery-ci-cd.yml'
  pull_request:
    branches: [ "main", "develop", "feature/*" ]
    paths:
      - 'backend/delivery_service/**'

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd backend/delivery_service
          npm install

      - name: Run Lint
        run: |
          cd backend/delivery_service
          npm run lint || echo "No lint script defined"

      - name: Check for syntax errors
        run: |
          cd backend/delivery_service
          node -c src/app.js

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          cd backend/delivery_service
          docker build -t delivery-service:latest .

      - name: Run Docker image to verify
        run: |
          docker run --rm delivery-service:latest node -c src/app.js

  deploy-staging:
    name: Deploy to Staging (Render)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Staging Deploy
        run: |
          echo "🚀 Deploying Delivery Service to Staging..."
          curl -X POST ${{ secrets.RENDER_DELIVERY_SERVICE_STAGING_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{"ref":"develop"}'
        continue-on-error: true

  deploy-production:
    name: Deploy to Production (Render)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Production Deploy
        run: |
          echo "🚀 Deploying Delivery Service to Production..."
          curl -X POST ${{ secrets.RENDER_DELIVERY_SERVICE_PROD_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}'
        continue-on-error: true

      - name: Health Check
        run: |
          echo "⏳ Waiting for service to be healthy..."
          sleep 10
          curl -f ${{ secrets.RENDER_DELIVERY_SERVICE_URL }}/health || echo "Service not yet available"
        continue-on-error: true
